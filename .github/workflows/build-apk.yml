name: Build AppCloner Pro APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-only-on-linux: true
    runs-on: ubuntu-latest

    steps:
      - name: 1. سحب ملفات المستودع (Checkout)
        uses: actions/checkout@v4

      - name: 2. فك ضغط ملف المشروع تلقائياً (Unzip Project)
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP file: $ZIP_FILE - Extracting..."
            unzip -o "$ZIP_FILE" -d .
          else
            echo "No ZIP file found in root, proceeding with existing files..."
          fi

      - name: 3. إعداد بيئة جافا (Set up JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. إعداد Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. إعداد Gradle 8.7 (متوافق مع AGP 8.5.2)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 6. بناء نسخة الـ APK (Assemble Debug APK)
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: 7. رفع ملف الـ APK الجاهز (Upload APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AppCloner-Pro-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
