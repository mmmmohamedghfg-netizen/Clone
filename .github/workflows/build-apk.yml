name: Build App Cloner Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Uploaded Project ZIP
        run: unzip -o AppCloner_Pro_Android_Project_updated.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/*.apk ./AppCloner-Pro.apk
          gh release delete v2.1.0 --cleanup-tag -y || true
          gh release create v2.1.0 ./AppCloner-Pro.apk \
            --target "${{ github.sha }}" \
            --title "App Cloner Pro v2.1 APK" \
            --notes "هوية جهاز مستقلة لكل نسخة، ومنع تعارض النسخ، وإصلاح أخطاء البناء وتسجيل الاسم"
