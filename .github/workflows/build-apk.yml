name: Build App Cloner Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Uploaded Project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP file: $ZIP_FILE - extracting..."
            unzip -o "$ZIP_FILE" -d .
          else
            echo "No ZIP file found in root directory!"
            exit 1
          fi
          if [ -f "app/src/main/java/com/appcloner/pro/engine/ApkClonerEngine.kt" ]; then
            sed -i 's/Regex("classes.*dex")/Regex("""classes\\d*\\.dex""")/g' app/src/main/java/com/appcloner/pro/engine/ApkClonerEngine.kt
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/*.apk ./AppCloner-Pro.apk
          gh release delete v2.0.0 --cleanup-tag -y || true
          gh release create v2.0.0 ./AppCloner-Pro.apk \
            --target "${{ github.sha }}" \
            --title "App Cloner Pro v2.0 Ultimate APK" \
            --notes "الإصدار المتكامل مع دمج Split APKs، حقن DEX Hook، تخطي التوقيع، قفل الآلة الحاسبة، البروكسي، والاستنساخ الجماعي"
          echo "=========================================="
          echo "رابط تحميل التطبيق المباشر:"
          echo "https://github.com/${{ github.repository }}/releases/download/v2.0.0/AppCloner-Pro.apk"
          echo "=========================================="
          
